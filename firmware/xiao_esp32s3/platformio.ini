; Nura robot firmware -- Seeed Studio XIAO ESP32-S3 (PRD 2).
;
; Build:   pio run -e xiao_esp32s3
; Flash:   pio run -e xiao_esp32s3 -t upload
; Monitor: pio device monitor
; Tests:   pio test -e xiao_esp32s3        (runs on the board itself)
;
; Two environments:
;   xiao_esp32s3          development -- allows a plain http:// backend on the
;                         LAN and prints structured serial logs.
;   xiao_esp32s3_release  refuses http:// and keeps logs to warnings.

[platformio]
default_envs = xiao_esp32s3

[env]
platform = platformio/espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3
    lovyan03/LovyanGFX@1.2.28
build_flags =
    -DNURA_FIRMWARE_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=0

[env:xiao_esp32s3]
build_flags =
    ${env.build_flags}
    -DNURA_ALLOW_INSECURE_HTTP=1
    -DNURA_LOG_LEVEL=3

[env:xiao_esp32s3_release]
build_flags =
    ${env.build_flags}
    -DNURA_LOG_LEVEL=1
